name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Required for checkout

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Clean install with explicit optional dependencies handling
        # Workaround for rollup optional dependencies issue: https://github.com/npm/cli/issues/4828
        run: |
          rm -rf node_modules
          npm ci --include=optional

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::568672915267:role/GitHubActions-Approver-InfraDeploy
          aws-region: us-west-2

      - name: Deploy CDK stacks
        if: github.event_name == 'push'
        run: npm run build && npx cdk deploy --all --require-approval never

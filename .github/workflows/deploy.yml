name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  id-token: write # Required for OIDC authentication
  contents: read # Required for checkout

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          # Disable npm cache to avoid platform-specific rollup dependency issues
          # https://github.com/npm/cli/issues/4828

      - name: Install dependencies
        # npm ci installs from lock file, but may miss platform-specific optional deps
        # https://github.com/npm/cli/issues/4828
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --save-optional --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: arn:aws:iam::568672915267:role/GitHubActions-Approver-InfraDeploy
          aws-region: us-west-2

      - name: Deploy CDK stacks
        if: github.event_name == 'push'
        run: npm run build && npx cdk deploy --all --require-approval never
